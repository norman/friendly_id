name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        database: [ mysql, trilogy, postgresql, sqlite3 ]
        gemfile: [ '8.1', '8.0', '7.2', '7.1', '7.0', '6.1', '6.0' ]
        ruby: [ '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0' ]
        exclude:
          # Active Record only ships the trilogy adapter from 7.1 onwards.
          - database: trilogy
            gemfile: '7.0'
          - database: trilogy
            gemfile: '6.1'
          - database: trilogy
            gemfile: '6.0'
          - gemfile: '6.0'
            ruby: '3.2'
          - gemfile: '6.0'
            ruby: '3.3'
          - gemfile: '6.0'
            ruby: '3.4'
          - gemfile: '6.0'
            ruby: '4.0'
          - gemfile: '6.1'
            ruby: '3.2'
          - gemfile: '6.1'
            ruby: '3.3'
          - gemfile: '6.1'
            ruby: '3.4'
          - gemfile: '6.1'
            ruby: '4.0'
          - gemfile: '7.0'
            ruby: '3.3'
          - gemfile: '7.0'
            ruby: '3.4'
          - gemfile: '7.0'
            ruby: '4.0'
          - gemfile: '7.1'
            ruby: '3.3'
          - gemfile: '7.1'
            ruby: '3.4'
          - gemfile: '7.1'
            ruby: '4.0'
          - gemfile: '7.2'
            ruby: '2.7'
          - gemfile: '7.2'
            ruby: '3.0'
          - gemfile: '7.2'
            ruby: '4.0'
          - gemfile: '8.0'
            ruby: '2.7'
          - gemfile: '8.0'
            ruby: '3.0'
          - gemfile: '8.0'
            ruby: '3.1'
          - gemfile: '8.1'
            ruby: '2.7'
          - gemfile: '8.1'
            ruby: '3.0'
          - gemfile: '8.1'
            ruby: '3.1'
      fail-fast: false
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: gemfiles/Gemfile.rails-${{ matrix.gemfile }}.rb
      BUNDLE_BUILD__SQLITE3: "--enable-system-libraries"
      BUNDLE_JOBS: 4
      CI: true
      DB: ${{ matrix.database }}
      MYSQL_PASSWORD: root
      PGHOST: localhost
      PGPASSWORD: postgres
      PGPORT: 5432
      PGUSER: postgres
      RAILS_ENV: test

    name: ${{ matrix.ruby }} ${{ matrix.database }} rails-${{ matrix.gemfile }}
    steps:
    - uses: actions/checkout@v7

    - run: sudo apt-get update

    - run: sudo apt-get install libmysqlclient-dev mysql-client -y
      if: matrix.database == 'mysql'

    - run: sudo apt-get install mysql-client -y
      if: matrix.database == 'trilogy'

    - run: sudo apt-get install libpq-dev postgresql-client -y
      if: matrix.database == 'postgresql'

    - run: sudo apt-get install libsqlite3-dev -y
      if: matrix.database == 'sqlite3'

    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        ruby-version: ${{ matrix.ruby }}

    - run: bundle exec rake db:{create,up}
    - run: bundle exec rake test

    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres

      mysql:
        image: mysql:8.4
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          MYSQL_ROOT_PASSWORD: root
